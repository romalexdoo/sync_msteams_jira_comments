[package]
name = "sync_msteams_jira_comments"
version = "0.1.0"
edition = "2024"

[dependencies]
adf2html = "1.0.4"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
envconfig = "0.11.1"
futures = "0.3.33"
hex = "0.4.3"
hmac = "0.13.0"
html2md = "0.2.15"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["rustls", "cookies", "form", "gzip", "http2", "json", "multipart", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["make"] }
tower-http = { version = "0.7.0", features = ["fs", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }
